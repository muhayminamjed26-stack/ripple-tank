name: Build APK (Muhaymin Waves)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create --org com.muhaymin --project-name ripple_tank --platforms android .

      - name: App name on the phone
        run: sed -i 's/android:label="[^"]*"/android:label="Muhaymin Waves"/' android/app/src/main/AndroidManifest.xml

      - name: Download Gradle from mirrors
        run: |
          P=android/gradle/wrapper/gradle-wrapper.properties
          V=$(grep -oE 'gradle-[0-9.]+-(all|bin)' $P | head -1 | sed -E 's/gradle-//; s/-(all|bin)//')
          echo "Gradle version: $V"
          F=/tmp/gradle-$V-bin.zip
          for u in \
            "https://services.gradle.org/distributions/gradle-$V-bin.zip" \
            "https://mirrors.cloud.tencent.com/gradle/gradle-$V-bin.zip" \
            "https://mirrors.aliyun.com/gradle/distributions/v$V/gradle-$V-bin.zip" \
            "https://downloads.gradle.org/distributions/gradle-$V-bin.zip"; do
            echo "Trying $u"
            curl -fL --retry 3 --retry-delay 5 -o $F "$u" && unzip -tq $F && break
            rm -f $F
          done
          test -s $F
          sed -i -E "s#^distributionUrl=.*#distributionUrl=file:///tmp/gradle-$V-bin.zip#" $P
          cat $P

      - run: flutter pub get
      - run: flutter test

      - name: Build APK (with retries)
        run: |
          for i in 1 2 3 4; do
            flutter build apk --release && exit 0
            echo "Build failed, retry $i in 45s..."
            sleep 45
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: Muhaymin-Waves-APK
          path: build/app/outputs/flutter-apk/app-release.apk
