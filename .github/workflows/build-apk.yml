name: Build APK (Muhaymin Waves)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create --org com.muhaymin --project-name ripple_tank --platforms android .

      - name: App name on the phone
        run: sed -i 's/android:label="[^"]*"/android:label="Muhaymin Waves"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Muhaymin-Waves-APK
          path: build/app/outputs/flutter-apk/app-release.apk
