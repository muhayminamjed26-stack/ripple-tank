name: Build APK (Muhaymin Waves)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create --org com.muhaymin --project-name ripple_tank --platforms android .

      - name: App name on the phone
        run: sed -i 's/android:label="[^"]*"/android:label="Muhaymin Waves"/' android/app/src/main/AndroidManifest.xml

      - name: Use official Gradle server (bin)
        run: |
          sed -i -E 's#^distributionUrl=.*gradle-([0-9.]+)-(all|bin)\.zip#distributionUrl=https\\://services.gradle.org/distributions/gradle-\1-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - run: flutter pub get
      - run: flutter test

      - name: Build APK (with retries)
        run: |
          for i in 1 2 3 4; do
            flutter build apk --release && exit 0
            echo "Build failed, retry $i in 45s..."
            sleep 45
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: Muhaymin-Waves-APK
          path: build/app/outputs/flutter-apk/app-release.apk
